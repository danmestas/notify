title: notify
baseURL: ""

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: API
      pageRef: /docs/api
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/danmestas/notify"
      params:
        icon: github

params:
  # Default version for local dev; the Cloudflare build replaces this with the
  # latest release tag via scripts/sync-version.sh before Hugo runs.
  version: "0.0.0"

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/danmestas/notify/edit/main/docs/site/content"

  page:
    width: wide
