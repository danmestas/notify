# =============================================================================
# sesh-root.conf — Tailscale-PRIVATE root NATS (the mesh anchor that is DEPLOYED)
# =============================================================================
#
# This is the config actually running on the Hetzner VPS. It is a plain
# `nats-server` acting as the mesh router for the sesh/notify mesh — NO workflow
# engine, NO JetStream (pure mesh router; each leaf runs its own JS).
#
# !!! SECURITY — the leafnode listener is bound to the TAILSCALE interface ONLY.
#     It is NEVER on the public internet: no public TLS, no nsc/JWT. The WireGuard
#     tunnel that Tailscale provides IS the transport encryption. Auth is a simple
#     leafnode user/password. The Mac's dagnats leafs in over the tailnet.
#
# !!! SECRET-FREE — nats-server expands `$VAR` from its process environment. The
#     leaf password and the tailnet bind address are supplied via the systemd
#     unit's EnvironmentFile (/etc/nats/sesh-root.env) and are NEVER committed:
#         SESH_LEAF_LISTEN   = <tailscale-ip>:7422   (e.g. 100.x.y.z:7422)
#         SESH_LEAF_PASSWORD = <secret>              (openssl rand -hex 24)
#     Do NOT put a real password or a 0.0.0.0 bind in this file.
#
# Validate (env-var expansion warns if SESH_* are unset — that is expected
# off-host; on-host the EnvironmentFile sets them):
#     nats-server -c /etc/nats/sesh-root.conf -t
#
# See ./README.md for the full deployed runbook.
# For the off-tailnet / public-exposure alternative (TLS + nsc), see
# ../public-tls/.
# =============================================================================

server_name: sesh-root

# --- client listener (LOOPBACK ONLY) -----------------------------------------
# Local tooling on the box (nats CLI, health checks) only. Never published.
# NON-DEFAULT port on purpose: a host often already runs another nats-server /
# dagnats on the default 4222, and sharing it makes THIS root crash-loop on
# "bind: address already in use" (which silently drops every leaf). Leaves use
# the leafnode port below, never this one, so any free loopback port works.
host: 127.0.0.1
port: 14222

# --- monitoring (LOOPBACK ONLY) ----------------------------------------------
# /varz, /connz etc. Scrape via SSH tunnel; never expose publicly.
# NON-DEFAULT port (not 8222) for the same collision-avoidance reason.
http: 127.0.0.1:18222

# --- leafnode listener (TAILSCALE-PRIVATE mesh entrypoint) --------------------
# Bound to the tailnet IP via $SESH_LEAF_LISTEN — NOT 0.0.0.0, NOT the public
# NIC. Leaves authenticate with a simple user/password over WireGuard.
leafnodes {
  listen: $SESH_LEAF_LISTEN
  authorization {
    user: "sesh-leaf"
    password: $SESH_LEAF_PASSWORD
    timeout: 3
  }
}

max_payload: 8MB

# --- JetStream: OFF -----------------------------------------------------------
# This root is a pure mesh router. Each Mini dagnats runs its own JetStream for
# notify's engine; the root stores nothing, stays stateless and trivially
# replaceable. Do NOT enable JetStream here.
