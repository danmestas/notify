# root-hub/nats-server.conf — the mesh anchor (root hub) for the sesh/notify mesh.
#
# This is a PLAIN nats-server (NOT dagnats): the root only routes the mesh; it
# runs no workflow engine. Mini dagnats (and later, other machines) dial IN as
# leaf nodes over a TLS-protected, nsc/JWT-authenticated leafnode listener.
#
# Deploy: nats-server -c nats-server.conf
# Syntax-check before shipping:  nats-server -c nats-server.conf -t
#
# NEVER commit cert/key material or operator seeds — the paths below are
# placeholders provided at deploy time by cert-manager / Let's Encrypt and nsc.

# --- identity / logging -------------------------------------------------------
server_name: "mesh-root-1"

# --- client listener ----------------------------------------------------------
# Direct NATS clients on the root are OPTIONAL — in the leaf topology the agents
# connect to their LOCAL dagnats, not here, so you may disable this entirely and
# expose only the leafnode listener (smaller attack surface). Left enabled and
# bound to loopback so local tooling (nats CLI on the box) works; it is NOT
# published publicly. To turn it off completely, comment the whole block.
host: "127.0.0.1"
port: 4222

# --- leafnode listener (the public mesh entrypoint) ---------------------------
# Leaf nodes (Mini dagnats, future machines) dial THIS. TLS is REQUIRED and auth
# is non-anonymous (JWT via the resolver below). This is the only listener that
# faces the network.
leafnodes {
  host: "0.0.0.0"
  port: 7422

  # TLS is mandatory on the leaf listener. cert-manager / Let's Encrypt on
  # Hetzner provisions these; mount them at /etc/nats/tls/. Leaf creds carry the
  # JWT identity, but the transport must still be encrypted.
  tls {
    cert_file: "/etc/nats/tls/tls.crt"
    key_file:  "/etc/nats/tls/tls.key"
    # ca_file is only needed for mutual TLS (verify: true). Server-auth TLS +
    # JWT leaf creds is sufficient; uncomment for mTLS if you also want the root
    # to verify a client cert.
    # ca_file: "/etc/nats/tls/ca.crt"
    # verify: true
    timeout: 5
  }
}

# --- authentication / authorization (FAIL-CLOSED — required include) ----------
# !!! SECURITY: this server WILL NOT START without auth.conf. That is by design.
#
# JWT auth (nsc-issued operator + accounts) lives in a SEPARATE auth.conf that is
# NOT in the repo and is GENERATED by bootstrap-nsc.sh. The include below is a
# HARD requirement: nats-server fails to parse this config — with a clear
# "auth.conf: no such file or directory" — until bootstrap has produced it.
#
# Why an uncommented, missing include instead of a commented-out block: a
# commented-out auth block fails OPEN — an operator who runs
# `nats-server -c nats-server.conf` as-is would bring the TLS leafnode listener
# up with NO auth and accept anonymous leaf connections. This include makes the
# server fail CLOSED: no auth.conf, no listener. You cannot accidentally expose
# an unauthenticated mesh anchor.
#
# auth.conf carries the operator JWT, system_account, and the account resolver
# (NOT a private seed, but still kept out of git — see .gitignore). It is emitted
# by `nsc generate config` inside bootstrap-nsc.sh. The Mini authenticates with
# its issued `.creds` (DAGNATS_LEAF_CREDENTIALS); there is NO anonymous access.
#
#   Generate it:   deploy/root-hub/bootstrap-nsc.sh   (writes auth.conf alongside this file)
#   Then start:    nats-server -c nats-server.conf
include "auth.conf"

# --- JetStream (OPTIONAL on the root) -----------------------------------------
# Tradeoff: enable JetStream ONLY if you want domain-spanning streams anchored at
# the root (e.g. a mesh-wide durable stream other leaves consume). For a pure
# router the root needs NO JetStream — each Mini dagnats already runs its own JS
# for notify's engine. Leaving it OFF keeps the root stateless and trivially
# replaceable. Uncomment to enable, and give it its own domain so it does not
# collide with the leaves' JS domains.
# jetstream {
#   store_dir: "/data/jetstream"
#   domain: "mesh"
#   max_memory_store: 256MB
#   max_file_store: 2GB
# }

# --- monitoring (KEEP INTERNAL) -----------------------------------------------
# /varz, /connz etc. Bind to loopback only — never expose the monitoring port
# publicly. Scrape it via a sidecar or an SSH tunnel.
http: "127.0.0.1:8222"
