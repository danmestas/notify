# git hooks via lefthook (offline-robust; replaces hk which fetched a remote pkl package at eval time)
pre-commit:
  commands:
    gofumpt:
      glob: "*.go"
      run: mise exec -- gofumpt -w {staged_files}
      stage_fixed: true
    build:
      glob: "*.go"
      run: go build ./...
    golangci-lint:
      glob: "*.go"
      run: mise exec -- golangci-lint run
pre-push:
  commands:
    golangci-lint:
      glob: "*.go"
      run: mise exec -- golangci-lint run
    vet:
      glob: "*.go"
      run: go vet ./...
    test:
      glob: "*.go"
      # -timeout is explicit because Go's default is 10m PER PACKAGE, and the
      # console package's suite lands close to that under -race on developer
      # hardware. Without this the gate rejects pushes based on how fast your
      # machine is rather than whether the code is correct, and the only ways
      # out are --no-verify or not pushing. The timeout is a hang backstop, so
      # it should be comfortably above the slowest legitimate package.
      run: go test -race -timeout 20m ./...
