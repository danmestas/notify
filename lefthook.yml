# git hooks via lefthook (offline-robust; replaces hk which fetched a remote pkl package at eval time)
pre-commit:
  commands:
    gofumpt:
      glob: "*.go"
      run: mise exec -- gofumpt -w {staged_files}
      stage_fixed: true
    build:
      glob: "*.go"
      run: go build ./...
    golangci-lint:
      glob: "*.go"
      run: mise exec -- golangci-lint run
pre-push:
  commands:
    golangci-lint:
      glob: "*.go"
      run: mise exec -- golangci-lint run
    vet:
      glob: "*.go"
      run: go vet ./...
    test:
      glob: "*.go"
      # Only the packages this push changes, without -race: a fast check that
      # the touched code and its tests still pass. CI runs the whole suite
      # under -race and is the merge gate, so several sessions pushing at once
      # don't each run the full suite on one machine.
      run: |
        dirs=$(git diff --name-only --diff-filter=d "$(git merge-base HEAD origin/main)" HEAD -- '*.go' | xargs -n1 dirname 2>/dev/null | sort -u | sed 's|^|./|')
        [ -z "$dirs" ] && exit 0
        pkgs=$(go list -e -f '{{if or .GoFiles .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' $dirs)
        [ -z "$pkgs" ] || go test -timeout 10m $pkgs
