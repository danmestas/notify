name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: >-
      ${{ (github.event_name == 'push'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON('["self-hosted","macOS","ARM64","mac-mini"]')
          || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'push' }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: ${{ github.event_name != 'push' }}
      - name: gofumpt (format check)
        run: |
          out=$(gofumpt -l .)
          if [ -n "$out" ]; then echo "::error::gofumpt needed:"; echo "$out"; exit 1; fi
      - name: golangci-lint
        run: golangci-lint run --timeout=5m
      - name: build
        run: go build ./...
      - name: build dagnats sidecar
        run: |
          # pinned to danmestas/dagnats@main as of 2026-07-19 (NATS server v2.14.3 / client v1.52.0); bump periodically.
          # f35e3c0 completes the cross-service trace seam this repo depends on:
          # #527 (NATS extract), #531 (span volume), #534 (poll-response trace
          # context, which internal/engine parses), #530 (trigger entrypoints) and
          # #529 (handler coverage). Pinning behind #534 would let a trace-stitch
          # assertion pass against a sidecar that cannot carry the context at all.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/danmestas/dagnats/cmd/dagnats@f35e3c0cd47c19e949d3fa027bced29b8cc522b2
          echo "DAGNATS_BIN=$RUNNER_TEMP/bin/dagnats" >> "$GITHUB_ENV"
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: duckdb backend (opt-in -tags duckdb; reuses sidecar above)
        run: |
          go build -tags duckdb ./...
          golangci-lint run --build-tags duckdb ./internal/analyticsduck/... ./cmd/notify/...
          go test -tags duckdb ./internal/analyticsduck/...
          go test -tags duckdb -race -run TestAnalytics_DeliveriesByChannel_DuckDB ./internal/httpapi/

  docker:
    # Mirrors the ci job: pushes and same-repo PRs run on the mac-mini, PRs
    # from forks stay on a GitHub-hosted runner. Deliberately NOT
    # unconditionally self-hosted -- the mini runs production (notify, dagnats,
    # the cloudflared tunnel) and four runners' credentials, so executing
    # fork-PR code there as dmestas would be a full production compromise.
    # The head-repo check is the precise expression of that: a same-repo branch
    # could only be pushed by someone who already has write access, so it is
    # exactly as trusted as a push to main, whereas a fork PR is arbitrary code
    # from anyone.
    runs-on: >-
      ${{ (github.event_name == 'push'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON('["self-hosted","macOS","ARM64","mac-mini"]')
          || 'ubuntu-latest' }}
    # Four self-hosted runners share ONE colima docker daemon on that box, and
    # this job publishes a fixed host port and does a project-scoped `down -v`.
    # A global (not per-ref) group serializes smokes so they cannot bind the
    # same port or tear down each other's volumes. cancel-in-progress stays
    # false: killing a run mid-compose leaves containers behind.
    concurrency:
      group: docker-smoke-shared-daemon
      cancel-in-progress: false
    env:
      # Isolate from any hand-run `notify` stack on the shared daemon.
      COMPOSE_PROJECT_NAME: notify-ci
      # 3000 is taken on the mini (agent.py). compose.yml and smoke.sh both
      # read this; the container side stays 3000.
      NOTIFY_HOST_PORT: "13000"
      # Likewise for dagnats' console port: 8081 is free on the mini today, but
      # this box hosts four runners and assorted services, so pin CI to a port
      # nothing else claims rather than depending on that staying true.
      DAGNATS_CONSOLE_HOST_PORT: "18081"
    steps:
      - uses: actions/checkout@v4
      - name: docker preflight + clear stale stack
        if: runner.environment == 'self-hosted'
        run: |
          # macOS has no timeout(1); a wedged daemon makes `docker info` hang forever.
          perl -e 'alarm 25; exec @ARGV' docker info >/dev/null 2>&1 \
            || { echo "::error::docker daemon unreachable on the runner. Check: brew services info colima"; exit 1; }
          docker compose down -v --remove-orphans || true
      - name: container stack smoke (compose up + health + bootstrap + auth API)
        run: bash docker/smoke.sh
      - name: cleanup (runs even if the job is cancelled)
        if: always() && runner.environment == 'self-hosted'
        run: docker compose down -v --remove-orphans || true
