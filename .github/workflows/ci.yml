name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: >-
      ${{ (github.event_name == 'push'
           || github.event.pull_request.head.repo.full_name == github.repository)
          && fromJSON('["self-hosted","macOS","ARM64","mac-mini"]')
          || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Hosted jobs use GitHub's cache service; self-hosted jobs retain their runner-local cache.
          cache: ${{ runner.environment != 'self-hosted' }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          # Hosted jobs use GitHub's cache service; self-hosted jobs retain their runner-local cache.
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: gofumpt (format check)
        run: |
          out=$(gofumpt -l .)
          if [ -n "$out" ]; then echo "::error::gofumpt needed:"; echo "$out"; exit 1; fi
      - name: golangci-lint
        run: golangci-lint run --timeout=5m
      - name: build
        run: go build ./...
      - name: build dagnats sidecar
        run: |
          # danmestas/dagnats v0.0.25 (f7c6d7d), 2026-10-17. Pinned to the
          # release tag rather than a bare SHA so the version being run is
          # legible; the SHA is recorded here for traceability.
          #
          # Keep this current: notify tracks the latest dagnats, and a stale pin
          # is a bug rather than a constraint to design around. It must stay at
          # or ahead of:
          #   #534 poll-response trace context, which internal/engine parses --
          #        pinning behind it lets a trace-stitch assertion pass against a
          #        sidecar that cannot carry the context at all
          #   #553 until_input_path sleep flavor, which a regular digest step
          #        compiles to so its window can be resolved per subscriber from
          #        the run input (#336)
          # Bump here and in Dockerfile's DAGNATS_VERSION together.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/danmestas/dagnats/cmd/dagnats@v0.0.25
          echo "DAGNATS_BIN=$RUNNER_TEMP/bin/dagnats" >> "$GITHUB_ENV"
      - name: test (race + coverage)
        # Explicit -timeout for the same reason as lefthook.yml: Go's 10m
        # default is per package, and console is close to it under -race. CI
        # runs on the mac-mini today and is well inside the limit, but a loaded
        # or slower runner should fail on a real hang, not on scheduling.
        run: go test -race -timeout 20m -coverprofile=coverage.out ./...
      - name: duckdb backend (opt-in -tags duckdb; reuses sidecar above)
        run: |
          go build -tags duckdb ./...
          golangci-lint run --build-tags duckdb ./internal/analyticsduck/... ./cmd/notify/...
          go test -tags duckdb ./internal/analyticsduck/...
          go test -tags duckdb -race -run TestAnalytics_DeliveriesByChannel_DuckDB ./internal/httpapi/

  docker:
    # Always GitHub-hosted: the image is what other people run, so it is
    # built and smoked on a stock Linux Docker host. The mini deploys notify
    # natively and keeps no container runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: container stack smoke (compose up + health + bootstrap + auth API)
        run: bash docker/smoke.sh
