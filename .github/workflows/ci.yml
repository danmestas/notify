name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: >-
      ${{ github.event_name == 'push'
          && fromJSON('["self-hosted","macOS","ARM64","mac-mini"]')
          || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: gofumpt (format check)
        run: |
          out=$(gofumpt -l .)
          if [ -n "$out" ]; then echo "::error::gofumpt needed:"; echo "$out"; exit 1; fi
      - name: golangci-lint
        run: golangci-lint run --timeout=5m
      - name: build
        run: go build ./...
      - name: build dagnats sidecar
        run: |
          # pinned to danmestas/dagnats@main as of 2026-07-16 (NATS server v2.14.3 / client v1.52.0); bump periodically
          GOBIN="$RUNNER_TEMP/bin" go install github.com/danmestas/dagnats/cmd/dagnats@ba0e68acb296ee2528830d3787e9b201547e7983
          echo "DAGNATS_BIN=$RUNNER_TEMP/bin/dagnats" >> "$GITHUB_ENV"
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: duckdb backend (opt-in -tags duckdb; reuses sidecar above)
        run: |
          go build -tags duckdb ./...
          golangci-lint run --build-tags duckdb ./internal/analyticsduck/... ./cmd/notify/...
          go test -tags duckdb ./internal/analyticsduck/...
          go test -tags duckdb -race -run TestAnalytics_DeliveriesByChannel_DuckDB ./internal/httpapi/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: container stack smoke (compose up + health + bootstrap + auth API)
        run: bash docker/smoke.sh
