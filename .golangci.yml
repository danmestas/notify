version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - bodyclose
  exclusions:
    paths:
      # .claude/worktrees holds sibling git worktrees (separate module copies).
      # Never lint them — a removed worktree leaves dangling cache refs that
      # otherwise surface as phantom issues and block unrelated pushes.
      - (^|/)\.claude/
    rules:
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofumpt
    - goimports
